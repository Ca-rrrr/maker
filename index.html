<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CoC 탐사자 메이커</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:rgba(0,0,0,.10);
      --shadow: 0 10px 28px rgba(0,0,0,.08);
      --radius:14px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:16px;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .wrap{ max-width: 980px; margin:0 auto; }
    h1{ margin: 0 0 12px; font-size: 20px; }
    .topbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-bottom: 14px;
    }
    button{
      border:0; border-radius: 12px; padding: 10px 14px;
      cursor:pointer; font-weight: 800;
      background:#eef2ff;
      white-space:nowrap;
    }
    button.primary{ background:#111827; color:#fff; }
    button.warn{ background:#fee2e2; }
    button:active{ transform: translateY(1px); }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid var(--line);
      border-radius: 999px; padding: 8px 12px;
      background: rgba(255,255,255,.7);
      font-size: 13px;
      white-space: nowrap;
    }
    .pill input{ margin:0; }
    .row{ display:flex; gap:16px; flex-wrap:wrap; }
    .card{
      background:var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .wide{ flex: 1 1 620px; }
    .side{ flex: 1 1 320px; }
    .muted{ color:var(--muted); font-size: 13px; }
    .section-title{
      font-weight: 900;
      margin: 0 0 10px;
      display:flex; align-items:baseline; justify-content:space-between; gap:10px;
      flex-wrap: wrap;
    }
    .section-title small{ font-weight:600; color:var(--muted); }
    .grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .stat-line{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding: 10px 10px;
      border-radius: 12px;
      border:1px solid rgba(0,0,0,.06);
      background:#fff;
      flex-wrap: wrap;
    }
    .stat-name{ font-weight: 900; width: 160px; }
    .choices{ display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .choice{
      border:1px solid rgba(0,0,0,.12);
      border-radius: 999px;
      padding: 7px 10px;
      display:inline-flex; align-items:center; gap:8px;
      cursor:pointer;
      user-select:none;
      background:#fff;
    }
    .choice input{ margin:0; }

    textarea{
      width:100%;
      border-radius: 14px;
      border:1px solid rgba(0,0,0,.12);
      padding: 10px;
      min-height: 160px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      background:#fbfbff;
    }
    .kpi{
      display:flex; gap:10px; flex-wrap:wrap;
      margin-top:10px;
    }
    .kpi .box{
      flex:1 1 180px;
      border:1px solid rgba(0,0,0,.10);
      border-radius: 12px;
      padding: 10px 12px;
      background:#fff;
      min-width: 160px;
    }
    .kpi .label{ color:var(--muted); font-size:12px; }
    .kpi .value{ font-weight: 950; font-size: 18px; }
    .log{
      border:1px solid rgba(0,0,0,.10);
      border-radius: 12px;
      padding: 10px 12px;
      background:#fff;
      max-height: 260px;
      overflow:auto;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    details{
      border:1px solid rgba(0,0,0,.08);
      border-radius: 12px;
      padding: 10px 12px;
      background:#fff;
      margin-bottom: 12px;
    }
    details > summary{
      cursor:pointer;
      font-weight: 900;
      list-style: none;
      outline: none;
    }
    details > summary::-webkit-details-marker{ display:none; }
    .ruletext{
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    @media (max-width: 720px){
      body{ margin:12px; }
      h1{ font-size: 18px; }
      .card{ padding: 12px; }
      .row{ gap:12px; }
      .wide, .side{ flex: 1 1 100%; }
      .stat-name{ width: 100%; }
      .choices{ justify-content:flex-start; }
      button{ padding: 10px 12px; border-radius: 12px; }
      .pill{ padding: 7px 10px; font-size: 12px; }
      textarea{ min-height: 150px; }
      .kpi .box{ flex: 1 1 calc(50% - 10px); }
    }
    @media (max-width: 420px){
      .kpi .box{ flex: 1 1 100%; }
      .topbar{ gap:8px; }
      button{ width: 100%; }
      .pill{ width: 100%; justify-content:space-between; }
    }

    @media print{
      body{ background:#fff; margin: 12mm; }
      .topbar, details, .muted, .pill, button{ display:none !important; }
      .card{ box-shadow:none; }
      textarea{ min-height: 120px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CoC 탐사자 메이커</h1>

    <details>
      <summary>【캐릭터를 성장시키자!】 규칙 보기</summary>
      <div class="ruletext" id="rulesBox"></div>
    </details>

    <div class="topbar">
      <button class="primary" id="rollBtn">🎲 3회 굴림</button>
      <button id="firstGenBtn">🧒 첫 생성 (13세 적용)</button>

      <button id="g16Btn">🧑 1차 성장 (16세)</button>
      <button id="g19Btn">🧑 2차 성장 (19세)</button>
      <button id="g22Btn">🧑 3차 성장 (22세)</button>
      <button id="g25Btn">🧑 4차 성장 (25세)</button>

      <button id="growthRollBtn">📈 시나리오 성장 (3D10)</button>
      <button id="growthManualBtn">✍️ 성장 수동추가</button>

      <button id="saveJsonBtn">💾 JSON 저장</button>
      <button id="loadJsonBtn">📂 JSON 불러오기</button>
      <button id="clearAutoSaveBtn" class="warn">🗑️ 자동저장 삭제</button>
      <button id="resetBtn" class="warn">🧹 리셋</button>

      <span class="pill"><b>seed</b> <span id="seedView">-</span></span>
      <span class="pill"><input type="checkbox" id="cap50" checked> <label for="cap50">특성 최대 50</label></span>
      <span class="pill"><input type="checkbox" id="freeApp" checked> <label for="freeApp">APP(외모) 자유 조정</label></span>

      <button id="copySummaryBtn">📋 요약 복사</button>
      <button id="copyRoll20Btn">💬 Roll20용 복사</button>
      <button id="printBtn">🖨️ 프린트(PDF)</button>
    </div>

    <div class="row">
      <div class="card wide">
        <div class="section-title">
          <span>특성치 / 세부사항 (3회 후보 선택)</span>
          <small>13세: APP/운(LUCK) 제외 /2, EDU=45 고정 (중복 적용 방지)</small>
        </div>

        <div class="grid" id="statsGrid"></div>

        <div class="kpi">
          <div class="box">
            <div class="label">기능점수 예산</div>
            <div class="value"><span id="skillBudget">-</span></div>
            <div class="muted" style="margin-top:6px;">직업(EDU×4) + 흥미(INT×2)</div>
          </div>
          <div class="box">
            <div class="label">성장 포인트(누적)</div>
            <div class="value"><span id="growthTotal">0</span> / <span id="growthLimit">120</span></div>
          </div>
          <div class="box">
            <div class="label">배분 가능한 성장 풀</div>
            <div class="value"><span id="growthPool">0</span></div>
          </div>
          <div class="box">
            <div class="label">시나리오 회차</div>
            <div class="value"><span id="scenarioCount">0</span></div>
          </div>
        </div>

        <div style="margin-top:14px;" class="section-title">
          <span>결과 출력</span>
          <small class="muted">복사용</small>
        </div>

        <div class="muted" style="margin:0 0 6px;">요약</div>
        <textarea id="outSummary" readonly></textarea>

        <div class="muted" style="margin:10px 0 6px;">Roll20 채팅용</div>
        <textarea id="outRoll20" readonly></textarea>
      </div>

      <div class="card side">
        <div class="section-title">
          <span>로그</span>
          <small class="muted">성장/굴림 기록</small>
        </div>
        <div class="log" id="logBox"></div>
      </div>
    </div>
  </div>

  <input type="file" id="jsonFileInput" accept="application/json" style="display:none" />

<script>
"use strict";

/** RNG */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79B9) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash32(a, b) {
  let x = (a ^ 0x9E3779B9) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B) >>> 0;
  x = (x + (b >>> 0)) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35) >>> 0;
  x = (x ^ (x >>> 16)) >>> 0;
  return x;
}
function parseSeed() {
  const sp = new URLSearchParams(location.search);
  const s = sp.get("seed");
  if (!s) return null;
  const n = Number(s);
  if (!Number.isFinite(n)) return null;
  return Math.floor(n);
}
function setSeedInUrl(seed) {
  const url = new URL(location.href);
  url.searchParams.set("seed", String(seed));
  history.replaceState({}, "", url.toString());
}
function makeSeed() { return Math.floor(Date.now() % 2147483647); }

/** dice */
function rollDie(rng, sides) { return Math.floor(rng() * sides) + 1; }
function rollNdM(rng, n, m) { let s = 0; for (let i=0;i<n;i++) s += rollDie(rng,m); return s; }

/** config */
const GROWTH_LIMIT = 120;
const AUTO_SAVE_KEY = "coc_maker_autosave_v7";
const STATS_KEYS = ["STR","CON","SIZ","DEX","INT","APP","POW","EDU","LUCK"];
const DETAIL_KEYS = ["BELIEF","PERSON","PLACE","THING","TRAIT"];

const RULES_TEXT = `【캐릭터를 성장시키자!】
플레이어의 캐릭터는 13살에서 시작하여 매 시나리오마다 성장합니다.
또한 매 시나리오가 끝날 때마다 교육 성장으로 얻는 추가 기능점수 외에 3D10점의 기능 점수를 얻어 배분할 수 있습니다. (최대 획득 가능 점수: 120점)
플레이어가 원한다면 수호자와 주사위를 굴리지 않고 백스토리에 맞는 범위 내에서 자유롭게 올리고 성장할 수도 있습니다.
또한 아래의 성장 툴에서 외모 수치는 해당되지 않으며, 자유롭게 올리고 내릴 수 있습니다.

[첫 생성: 13세]
각 특성치의 주사위를 굴린 후 2로 나눕니다. (ex. 근력: (3D6x5)/2)
교육은 모두 45로 통일합니다.
특성/기능의 최대 수치는 50을 넘을 수 없습니다.
※ 이 툴에서는 13세 적용 시 외모(APP)와 운(LUCK)은 /2 적용에서 제외됩니다.

[1차 성장: 16세]
근력, 크기, 민첩, 지능, 건강을 1D10점 향상합니다.
정신력과 교육은 각각 최대 10점내에서 자유로이 올립니다.

[2차 성장: 19세]
근력, 크기, 민첩, 지능, 건강을 1D10점 향상합니다. (하락도 가능.)
정신력과 교육은 각 10점씩 향상합니다. (최대치 적용 시 70이 됩니다.)

[3차 성장: 22세]
성장하고 싶은 특성을 4가지 정해 1D10점을 올립니다. 특성의 하락도 가능 합니다.
그 외 3가지 특성은 향상 판정을 진행, 성공 시 1D10점을 향상합니다.

[4차 성장: 25세]
성장하고 싶은 특성에 향상 판정을 하여 성공 시 1D10점을 향상합니다.
정신력과 교육은 원할 경우 1D10점씩 상승합니다.`;

const groups = [
  { key: "STR", label: "근력", fn: (rng) => rollNdM(rng, 3, 6) * 5 },
  { key: "CON", label: "건강", fn: (rng) => rollNdM(rng, 3, 6) * 5 },
  { key: "SIZ", label: "크기", fn: (rng) => (rollNdM(rng, 2, 6) + 6) * 5 },
  { key: "DEX", label: "민첩성", fn: (rng) => rollNdM(rng, 3, 6) * 5 },
  { key: "INT", label: "지능", fn: (rng) => (rollNdM(rng, 2, 6) + 6) * 5 },
  { key: "APP", label: "외모(APP)", fn: (rng) => rollNdM(rng, 3, 6) * 5 },
  { key: "POW", label: "정신력", fn: (rng) => rollNdM(rng, 3, 6) * 5 },
  { key: "EDU", label: "교육(EDU)", fn: (rng) => (rollNdM(rng, 2, 6) + 6) * 5 },
  { key: "LUCK", label: "운", fn: (rng) => rollNdM(rng, 3, 6) * 5 },

  { key: "BELIEF", label: "사상·신념 (1d10)", fn: (rng) => rollNdM(rng, 1, 10) },
  { key: "PERSON", label: "중요한 사람 (1d10)", fn: (rng) => rollNdM(rng, 1, 10) },
  { key: "PLACE", label: "의미 있는 장소 (1d10)", fn: (rng) => rollNdM(rng, 1, 10) },
  { key: "THING", label: "소중한 물건 (1d10)", fn: (rng) => rollNdM(rng, 1, 10) },
  { key: "TRAIT", label: "성격 (1d10)", fn: (rng) => rollNdM(rng, 1, 10) },
];

const labelByKey = {
  STR:"근력", CON:"건강", SIZ:"크기", DEX:"민첩", INT:"지능", APP:"외모", POW:"정신력", EDU:"교육", LUCK:"운"
};
const statListForChoice = ["STR","CON","SIZ","DEX","INT","POW","EDU","LUCK","APP"];

/** state */
const state = {
  seed: 0,
  rolls: new Map(),
  pick: new Map(),
  isFirstGenApplied: false,
  scenarioCount: 0,
  growthTotal: 0,
  growthPool: 0,
  log: [],
  milestones: { g16:false, g19:false, g22:false, g25:false }
};

/** helpers */
function getCap50Enabled() { const el = document.getElementById("cap50"); return !!el && el.checked; }
function isFreeAppEnabled() { const el = document.getElementById("freeApp"); return !!el && el.checked; }

function capValue(key, v) {
  const capOn = getCap50Enabled();
  if (!capOn) return v;
  if (key === "APP" && isFreeAppEnabled()) return v;
  return Math.min(v, 50);
}
function findGroupLabel(key) {
  const g = groups.find((x) => x.key === key);
  return g ? g.label : (labelByKey[key] ?? key);
}
function getSelectedValue(key) {
  const arr = state.rolls.get(key) ?? [0,0,0];
  const idx = state.pick.get(key) ?? 0;
  const raw = arr[idx] ?? 0;
  return STATS_KEYS.includes(key) ? capValue(key, raw) : raw;
}
function setSelectedRawValue(key, newRaw) {
  const idx = state.pick.get(key) ?? 0;
  const arr = state.rolls.get(key) ?? [0,0,0];
  arr[idx] = newRaw;
  state.rolls.set(key, arr);
}

function computeSkillBudgetText() {
  const edu = getSelectedValue("EDU");
  const intel = getSelectedValue("INT");
  const job = edu * 4;
  const hobby = intel * 2;
  const total = job + hobby;
  return `${total} (직업 ${job} + 흥미 ${hobby})`;
}

function renderSeed() {
  const el = document.getElementById("seedView");
  if (el) el.textContent = String(state.seed);
}
function renderKpi() {
  const budEl = document.getElementById("skillBudget");
  if (budEl) budEl.textContent = computeSkillBudgetText();

  const totalEl = document.getElementById("growthTotal");
  const limitEl = document.getElementById("growthLimit");
  const poolEl = document.getElementById("growthPool");
  const scEl = document.getElementById("scenarioCount");
  if (totalEl) totalEl.textContent = String(state.growthTotal);
  if (limitEl) limitEl.textContent = String(GROWTH_LIMIT);
  if (poolEl) poolEl.textContent = String(state.growthPool);
  if (scEl) scEl.textContent = String(state.scenarioCount);
}
function renderLog() {
  const box = document.getElementById("logBox");
  if (box) box.textContent = state.log.join("\n");
}
function pushLog(line) {
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  state.log.unshift(`[${ts}] ${line}`);
  renderLog();
  autoSave();
}

function stageRng(stageCode, key) {
  let k = 0;
  for (let i=0;i<key.length;i++) k = (k * 31 + key.charCodeAt(i)) >>> 0;
  const s = hash32(state.seed >>> 0, (stageCode * 1000 + (k % 997)) >>> 0);
  return mulberry32(s);
}

function promptIntInRange(message, min, max, def) {
  const raw = prompt(message, String(def));
  if (raw === null) return null;
  const n = Number(raw);
  if (!Number.isFinite(n)) { alert("숫자를 입력해줘."); return null; }
  const v = Math.floor(n);
  if (v < min || v > max) { alert(`${min} ~ ${max} 사이로 입력해줘.`); return null; }
  return v;
}
function promptYesNo(message, defYes) {
  const def = defYes ? "y" : "n";
  const raw = prompt(`${message} (y/n)`, def);
  if (raw === null) return null;
  const t = raw.trim().toLowerCase();
  return t === "y" || t === "yes" || t === "ㅇ" || t === "ㅛ";
}
function pickSignForDelta(statKey, delta) {
  const raw = prompt(`${labelByKey[statKey] ?? statKey} 변화량: ${delta}\n하락도 가능: +면 그대로, -면 마이너스 적용\n(+/- 입력)`, "+");
  if (raw === null) return null;
  const t = raw.trim();
  if (t === "-") return -delta;
  return delta;
}

/** rolling */
function doRoll(seed) {
  state.seed = seed;
  state.rolls.clear();
  state.pick.clear();
  state.isFirstGenApplied = false;
  state.milestones = { g16:false, g19:false, g22:false, g25:false };

  const rng = mulberry32(seed);
  for (const g of groups) {
    const arr = [g.fn(rng), g.fn(rng), g.fn(rng)];
    state.rolls.set(g.key, arr);
    state.pick.set(g.key, 0);
  }
  setSeedInUrl(seed);
  renderAll();
  pushLog(`3회 굴림 실행 (seed=${seed})`);
}

function applyFirstGen13() {
  if (state.isFirstGenApplied) {
    alert("이미 13세 적용이 되어 있어! 다시 하려면 리셋 또는 3회 굴림을 눌러줘.");
    return;
  }
  // ✅ 13세: APP/운(LUCK) 제외 /2, EDU=45 고정
  for (const k of STATS_KEYS) {
    if (k === "EDU") {
      state.rolls.set(k, [45,45,45]);
      state.pick.set(k, 0);
      continue;
    }
    if (k === "APP" || k === "LUCK") continue;

    const values = state.rolls.get(k);
    if (!values) continue;
    const halved = values.map((v) => Math.floor(v / 2));
    state.rolls.set(k, halved);
    state.pick.set(k, 0);
  }
  state.isFirstGenApplied = true;
  renderAll();
  pushLog("첫 생성(13세) 적용: APP/운(LUCK) 제외 /2, EDU=45 고정");
}

/** milestone growth rules */
function growth16() {
  if (state.milestones.g16) { alert("이미 1차 성장(16세)을 적용했어."); return; }

  const upStats = ["STR","SIZ","DEX","INT","CON"];
  const deltas = [];

  for (const s of upStats) {
    const rng = stageRng(16, s);
    const d = rollNdM(rng, 1, 10);
    const cur = (state.rolls.get(s) ?? [0,0,0])[state.pick.get(s) ?? 0];
    setSelectedRawValue(s, cur + d);
    deltas.push(`${labelByKey[s]} +${d}`);
  }

function parseStatCsv(input) {
  const items = input.split(",").map((x) => x.trim().toUpperCase()).filter((x) => x.length > 0);
  const unique = [];
  for (const it of items) {
    if (!statListForChoice.includes(it)) continue;
    if (!unique.includes(it)) unique.push(it);
  }
  return unique;
}

/** scenario growth (skill points) */
function scenarioGrowthRoll() {
  if (state.growthTotal >= GROWTH_LIMIT) { alert("더 이상 성장할 수 없습니다. (최대 120점)"); return; }
  const nextScenario = state.scenarioCount + 1;
  const rng = mulberry32(hash32(state.seed, nextScenario));
  const rolled = rollNdM(rng, 3, 10);
  const remaining = GROWTH_LIMIT - state.growthTotal;
  const gained = Math.min(rolled, remaining);

  state.scenarioCount = nextScenario;
  state.growthTotal += gained;
  state.growthPool += gained;

  renderKpi(); updateOutputs(); autoSave();
  pushLog(`${state.scenarioCount}회차 시나리오 성장: 3D10=${rolled} → +${gained} (누적 ${state.growthTotal}/${GROWTH_LIMIT})`);
}
function scenarioGrowthManual() {
  if (state.growthTotal >= GROWTH_LIMIT) { alert("더 이상 성장할 수 없습니다. (최대 120점)"); return; }
  const raw = prompt("수동으로 추가할 성장 포인트를 입력해줘.", "10");
  if (raw === null) return;
  const n = Number(raw);
  if (!Number.isFinite(n) || n < 0) { alert("숫자를 올바르게 입력해줘."); return; }

  const remaining = GROWTH_LIMIT - state.growthTotal;
  const gained = Math.min(Math.floor(n), remaining);
  state.growthTotal += gained;
  state.growthPool += gained;

  renderKpi(); updateOutputs(); autoSave();
  pushLog(`시나리오 성장 수동추가: +${gained} (누적 ${state.growthTotal}/${GROWTH_LIMIT})`);
}

/** UI render */
function renderStatsGrid() {
  const grid = document.getElementById("statsGrid");
  if (!grid) return;
  grid.innerHTML = "";

  const ordered = [...STATS_KEYS, ...DETAIL_KEYS];
  for (const key of ordered) {
    const label = findGroupLabel(key);
    const values = state.rolls.get(key) ?? [0,0,0];
    const picked = state.pick.get(key) ?? 0;

    const line = document.createElement("div");
    line.className = "stat-line";

    const name = document.createElement("div");
    name.className = "stat-name";
    name.textContent = label;

    const choices = document.createElement("div");
    choices.className = "choices";

    values.forEach((raw, idx) => {
      const v = (STATS_KEYS.includes(key)) ? capValue(key, raw) : raw;

      const lab = document.createElement("label");
      lab.className = "choice";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = `pick_${key}`;
      radio.checked = idx === picked;
      radio.addEventListener("change", () => {
        state.pick.set(key, idx);
        renderKpi();
        updateOutputs();
        autoSave();
      });

      lab.appendChild(radio);
      lab.appendChild(document.createTextNode(String(v)));
      choices.appendChild(lab);
    });

    line.appendChild(name);
    line.appendChild(choices);

    if (key === "APP") {
      const box = document.createElement("div");
      box.style.display = "flex";
      box.style.gap = "8px";
      box.style.justifyContent = "flex-end";

      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.max = isFreeAppEnabled() ? "999" : (getCap50Enabled() ? "50" : "999");
      input.value = String(getSelectedValue("APP"));
      input.style.width = "110px";

      const btn = document.createElement("button");
      btn.textContent = "APP 적용";
      btn.addEventListener("click", () => {
        const n = Number(input.value);
        if (!Number.isFinite(n) || n < 0) { alert("APP 값이 올바르지 않아."); return; }
        const v = Math.floor(n);
        const applied = isFreeAppEnabled() ? v : capValue("APP", v);
        setSelectedRawValue("APP", applied);
        renderKpi();
        updateOutputs();
        autoSave();
        pushLog(`APP 직접 적용: ${applied}`);
        renderStatsGrid();
      });

      box.appendChild(input);
      box.appendChild(btn);
      line.appendChild(box);
    }

    grid.appendChild(line);
  }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); alert("복사 완료!"); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
    alert("복사 완료!");
  }
}

/** JSON + autosave */
function exportJsonObject() {
  const rolls = Object.create(null);
  for (const [k, v] of state.rolls.entries()) rolls[k] = v;

  const pick = Object.create(null);
  for (const [k, v] of state.pick.entries()) pick[k] = v;

  return {
    version: 7,
    savedAt: new Date().toISOString(),
    seed: state.seed,
    isFirstGenApplied: state.isFirstGenApplied,
    scenarioCount: state.scenarioCount,
    growthTotal: state.growthTotal,
    growthPool: state.growthPool,
    milestones: state.milestones,
    ui: { cap50: getCap50Enabled(), freeApp: isFreeAppEnabled() },
    rolls, pick,
    log: state.log,
  };
}

function validateImported(obj) {
  if (!obj || typeof obj !== "object") return "JSON 형식이 올바르지 않아.";
  if (typeof obj.seed !== "number" || !Number.isFinite(obj.seed)) return "seed가 없어.";
  if (!obj.rolls || typeof obj.rolls !== "object") return "rolls가 없어.";
  if (!obj.pick || typeof obj.pick !== "object") return "pick이 없어.";
  return null;
}

function loadFromObject(obj) {
  const err = validateImported(obj);
  if (err) { alert(err); return; }

  state.seed = Math.floor(obj.seed);
  state.isFirstGenApplied = !!obj.isFirstGenApplied;
  state.scenarioCount = Math.max(0, Math.floor(Number(obj.scenarioCount) || 0));
  state.growthTotal = Math.max(0, Math.floor(Number(obj.growthTotal) || 0));
  state.growthPool = Math.max(0, Math.floor(Number(obj.growthPool) || 0));
  state.log = Array.isArray(obj.log) ? obj.log.map(String) : [];
  state.milestones = obj.milestones && typeof obj.milestones === "object"
    ? { g16:!!obj.milestones.g16, g19:!!obj.milestones.g19, g22:!!obj.milestones.g22, g25:!!obj.milestones.g25 }
    : { g16:false, g19:false, g22:false, g25:false };

  const capEl = document.getElementById("cap50");
  const appEl = document.getElementById("freeApp");
  if (capEl) capEl.checked = !!obj.ui?.cap50;
  if (appEl) appEl.checked = !!obj.ui?.freeApp;

  state.rolls.clear();
  state.pick.clear();

  for (const k of Object.keys(obj.rolls)) {
    const arr = obj.rolls[k];
    if (Array.isArray(arr) && arr.length === 3) {
      state.rolls.set(k, [Number(arr[0])||0, Number(arr[1])||0, Number(arr[2])||0]);
    }
  }
  for (const k of Object.keys(obj.pick)) {
    const idx = Number(obj.pick[k]);
    state.pick.set(k, Number.isFinite(idx) ? Math.max(0, Math.min(2, Math.floor(idx))) : 0);
  }

  setSeedInUrl(state.seed);
  renderAll();
  autoSave();
  pushLog("JSON 불러오기 완료");
}

function downloadJson() {
  const obj = exportJsonObject();
  const text = JSON.stringify(obj, null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  const stamp = new Date();
  const y = stamp.getFullYear();
  const m = String(stamp.getMonth()+1).padStart(2,"0");
  const d = String(stamp.getDate()).padStart(2,"0");
  const hh = String(stamp.getHours()).padStart(2,"0");
  const mm = String(stamp.getMinutes()).padStart(2,"0");
  a.href = url;
  a.download = `coc_maker_${y}${m}${d}_${hh}${mm}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  pushLog("JSON 저장(다운로드)");
}

function autoSave() {
  try { localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify(exportJsonObject())); }
  catch { /* ignore */ }
}

function loadAutoSaveIfAny() {
  try {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    if (!raw) return false;
    const obj = JSON.parse(raw);
    const err = validateImported(obj);
    if (err) return false;

    state.seed = Math.floor(obj.seed);
    state.isFirstGenApplied = !!obj.isFirstGenApplied;
    state.scenarioCount = Math.max(0, Math.floor(Number(obj.scenarioCount) || 0));
    state.growthTotal = Math.max(0, Math.floor(Number(obj.growthTotal) || 0));
    state.growthPool = Math.max(0, Math.floor(Number(obj.growthPool) || 0));
    state.log = Array.isArray(obj.log) ? obj.log.map(String) : [];
    state.milestones = obj.milestones && typeof obj.milestones === "object"
      ? { g16:!!obj.milestones.g16, g19:!!obj.milestones.g19, g22:!!obj.milestones.g22, g25:!!obj.milestones.g25 }
      : { g16:false, g19:false, g22:false, g25:false };

    const capEl = document.getElementById("cap50");
    const appEl = document.getElementById("freeApp");
    if (capEl) capEl.checked = !!obj.ui?.cap50;
    if (appEl) appEl.checked = !!obj.ui?.freeApp;

    state.rolls.clear();
    state.pick.clear();
    for (const k of Object.keys(obj.rolls)) {
      const arr = obj.rolls[k];
      if (Array.isArray(arr) && arr.length === 3) state.rolls.set(k, [Number(arr[0])||0, Number(arr[1])||0, Number(arr[2])||0]);
    }
    for (const k of Object.keys(obj.pick)) {
      const idx = Number(obj.pick[k]);
      state.pick.set(k, Number.isFinite(idx) ? Math.max(0, Math.min(2, Math.floor(idx))) : 0);
    }

    setSeedInUrl(state.seed);
    renderAll();
    return true;
  } catch { return false; }
}

function clearAutoSave() {
  try { localStorage.removeItem(AUTO_SAVE_KEY); alert("자동저장 삭제 완료"); }
  catch { alert("자동저장 삭제 실패"); }

(function init() {
  const rulesEl = document.getElementById("rulesBox");
  if (rulesEl) rulesEl.textContent = RULES_TEXT;

  const restored = loadAutoSaveIfAny();
  if (restored) return;

  const seed = parseSeed() ?? makeSeed();
  setSeedInUrl(seed);
  doRoll(seed);
  pushLog("페이지 초기화 완료");
})();
</script>
</body>
